<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>repairhub-register</title>
  <link rel="stylesheet" href="../../src/style.css">
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
  />
</head>
<body class="bg-cover bg-center bg-[url('/Rectangle-bg.png')] bg-no-repeat min-h-screen py-5">
  <div class=""></div>
  <div class="max-w-2xl rounded-xl w-[98%] mx-auto bg-white py-5 px-3 md:px-5">
    <div class="flex flex-col mb-4">
      <img src="/logo-4.png" alt="RepairHub Logo" class="w-[220px] h-[200px] mx-auto mt-[-55px]">
      <div class="text-center w-full">
        <h1 class="text-xl md:text-2xl font-bold">Create repair request</h1>
      </div>
    </div>
    <form action="" class="w-full space-y-6" id="request-repair-form" method="post">
      <div class="">
        <label class="text-sm md:text-lg text-black font-bold">What needs repair?</label>
        <select id="category" name="category_id" class="w-full border border-black rounded-lg px-3 py-3 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
          

        </select>
      </div>
      <div>
        <label for="name" class="text-sm md:text-lg text-black font-bold">Title</label>
        <input type="text" id="title" name="title" placeholder="eg. 'Cracked iphone 12 screen'" class="w-full border border-black rounded-lg px-3 py-3 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" minlength="3" maxlength="50" required>
      </div>
      <div>
        <label for="email" class="text-sm md:text-lg text-black font-bold">Describe the problem</label>
        <textarea name="description" id="description" placeholder="describe the problem of your device" class="w-full p-3 h-45 border rounded-lg"></textarea>
      </div>

      <div class="" >
        <label for="photo">Add a photo (Optional)</label>
        <input type="file" id="photo-input" name="photos" accept="image/*" multiple class="hidden"/>
        <div id="photo-preview-container" class="grid grid-cols-2 gap-4 sm:grid-cols-3">

          <button class="flex flex-col bg-[#2563EB4D]  items-center justify-center w-[120px] h-[130px] rounded-lg cursor-pointer" id="add-photo-btn">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M38 26H26V38H22V26H10V22H22V10H26V22H38V26Z" fill="#2563EB" fill-opacity="0.78"/></svg> 
            <p>Add photo</p>
          </button>

        </div>
      </div>

      <div>
        <label for="name" class="text-sm md:text-lg text-black font-bold">location</label>
        <div class="w-full flex gap-1">
          <input type="text" id="location" name="location" placeholder="eg. 'Yaba' Lagos" class="w-full border border-black rounded-lg px-3 py-3 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" minlength="3" maxlength="50" required>
          <button type="button"  id="get-location-btn" class="flex gap-0.5 items-center hover:bg-blue-700 transition-all duration-300 text-white text-semibold w-40 justify-center rounded-lg bg-[#2563EB]">
            <i class="ph-fill ph-gps-fix text-xl"></i>
            <span class="text-sm md:text-base" id="loction-btn-text">use Gps</span>
          </button>
        </div>
      </div>
      
      <div>
        <button id="request-submit-btn" type="submit" class="w-full text-sm md:text-lg font-medium bg-[#2563EB]  text-white py-4 rounded-md hover:bg-blue-700 transition-colors duration-300 active:scale-99 cursor-pointer" id="submit">Post repair request</button>
        
      </div>
    </form>
  </div>
  <script src="../../src/js/pages/customer/request-repair.js" type="module"></script>
</body>
</html>
