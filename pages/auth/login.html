<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>repairhub-register</title>
  <link rel="stylesheet" href="../../src/style.css">
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
  />
</head>
<body class="bg-cover bg-center bg-[url('/Rectangle-bg.png')] bg-no-repeat min-h-screen py-5">
  <div class="max-w-lg rounded-3xl w-[95%] mx-auto bg-white pb-7 px-3 md:px-5">
    <div class="flex flex-col mb-5">
      <img src="/logo-4.png" alt="RepairHub Logo" class="w-[200px] h-[200px] mx-auto mt-[-40px]">
      <div class="space-y-1 w-full">
        <h1 class="text-xl md:text-2xl font-bold">Welcome Back!!</h1>
        <div>
          <p class="text-sm md:text-base text-black">Login to Continue</p>
          
        </div>
      </div>
    </div>
    <form action="" class="w-full flex flex-col space-y-6">
      <div>
        <input type="text" id="name" name="name" placeholder="Enter your full name" class="w-full border border-black rounded-2xl px-3 py-4 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-black" required>
      </div>
      <div class="w-full">

        <div class="h-15 w-full relative mb-1">
          <input type="text" id="name" name="name" placeholder="password" class="px-3 w-full h-full border border-black rounded-2xl mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-black" required>
  
          <i class="ph-bold ph-eye-slash text-xl text-black absolute right-5 top-1/2 -translate-y-1/2"></i>
        </div>

        <div class="flex items-center mb-2">
          <img src="/error.png" alt="">
          <p class="md:text-sm text-xs text-black">Password must be at least 8 characters</p>
        </div>

        <div class="w-full text-right">
          <a href="/pages/auth/forgot-password.html" class="text-[#2563EB] hover:underline inline-block">Forgot Password?</a>
        </div>

      </div>

      <div>
        <button type="submit" class="inline-block w-full text-sm md:text-lg font-medium bg-[#2563EB] text-white py-4 rounded-md hover:bg-blue-600 transition-colors duration-300 active:scale-99 cursor-pointer">Login</button>
      </div>
    </form>

    <div class="flex items-center my-8">
        <div class="flex-1 h-px bg-black"></div>

        <span class="px-4 text-sm text-black text-base">
            Or continue with
        </span>

        <div class="flex-1 h-px bg-black"></div>

    </div>

    <div class="w-full space-y-3">
      <button class="w-full rounded-2xl py-4 border border-black cursor-pointer">
        <img src="/icons8-google-48.png" alt="Google Icon" class="inline-block w-6 h-6">
        <span class="">Continue with Google</span>
      </button>
      <button class="w-full rounded-2xl py-4 border border-black cursor-pointer flex items-center justify-center space-x-2">
        <i class="ph-fill ph-apple-logo text-2xl"></i>
        <span class="">Continue with Apple</span>
      </button>
    </div>

    <div class="w-full text-center mt-6">
      <p class="text-sm md:text-lg text-black">
        Don't have an account? 
        <a href="/pages/auth/register.html" class="text-[#2563EB] hover:underline">Create Account</a>
      </p>
    </div>
  </div>
</body>
</html>
