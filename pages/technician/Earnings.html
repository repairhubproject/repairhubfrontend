<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../src/style.css">
    <title>Earnings</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
  </head>
  <body class="">
    <header class="w-full shadow-[0_2px_10px_rgba(0,0,0,0.08)] fixed top-0 left-0 py-3 z-50 bg-white max-md:hidden">
      <div class="flex justify-between gap-7 max-w-7xl mx-auto items-center w-[95%]">
        <div class="flex items-center gap-5">
          <div class="w-[35px] h-[34px] lg:w-[65px] lg:h-[64px]">
            <img src="../../src/assets/images/logo.png" alt="" class="object-fit w-full h-full">
          </div>
          <span class="font-semibold text-black lg:text-2xl text-lg">RepairHub</span>
        </div>
        <div class="search-box flex md:w-xs lg:w-xl border border-[rgba(0,0,0,0.4)] px-2 rounded-lg h-12 items-center">
          <input type="text" placeholder="Search for a service" class="w-full h-full outline-none">
          <i class="ph ph-magnifying-glass text-lg"></i>
        </div>
        <div class="flex items-center gap-5">
          <i class="ph ph-bell text-xl transition-all duration-300 hover:scale-105 cursor-pointer"></i>
          <div class="flex gap-3 items-center">
            <div class="lg:w-[54px] lg:h-[54px] w-[44px] h-[44px] bg-slate-300 rounded-full">
              <img src="../../src/assets/Profile-pic.png" alt="" class="h-full w-full object-fill">
            </div>
            <span class="text-base text-black">John Bull</span>
          </div>
        </div>
      </div>
    </header>

    <div class="md:flex w-full md:h-screen overflow-hidden">
      <aside class="w-2xs border-r h-full shadow-[4px_0_12px_rgba(0,0,0,0.15)] pt-40 max-md:hidden overflow-y-auto hide-scrollbar">
        <nav aria-label="Main navigation" class="px-5 mb-10">
          <ul class="w-[190px] flex flex-col gap-3">
            <li class="w-full  cursor-pointer px-3 py-2 rounded-lg">
              <a href="dashboard.html" class="text-base text-black transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-house text-xl text-blue-600"></i>
                <span class="">Home</span>
              </a>
            </li>
            <li class="w-full  cursor-pointer px-3 py-2 rounded-lg">
              <a href="requests.html" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-grid-four text-xl text-blue-600"></i>
                <span class="">Requests</span>
              </a>
            </li>
            <li class="w-full bg-[rgba(193,211,249,1)] cursor-pointer px-3 py-2 rounded-lg">
              <a href="Earnings.html" class="text-base text-[rgba(37,99,235,1)] hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-calendar-blank text-xl text-blue-600"></i>
                <span class="">Earnings</span>
              </a>
            </li>
            <li class="w-full cursor-pointer px-3 py-2 rounded-lg">
              <a href="message.html" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-chat text-xl text-blue-600"></i>
                <span class="">Message</span>
              </a>
            </li>
            <li class="w-full cursor-pointer px-3 py-2 rounded-lg">
              <a href="" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-user text-xl text-blue-600"></i>
                <span class="">Verification</span>
              </a>
            </li>
            <li class="w-full cursor-pointer px-3 py-2 rounded-lg">
              <a href="" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-user text-xl text-blue-600"></i>
                <span class="">Profile</span>
              </a>
            </li>
            <li class="w-full cursor-pointer px-3 py-2 rounded-lg">
              <a href="" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-gear text-xl text-blue-600"></i>
                <span class="">Settings</span>
              </a>
            </li>
            <li class="w-full cursor-pointer px-3 py-2 rounded-lg">
              <a href="" class="text-base text-black hover:text-[rgba(37,99,235,1)] transition-all duration-300 ease flex items-center gap-2">
                <i class="ph-fill ph-info text-xl text-blue-600"></i>
                <span class="">Help & Support</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="px-1 flex flex-col gap-1 py-1">
          <div class="bg-[rgba(193,211,249,1)] rounded-lg pt-3 pb-10">
            <h1 class="text-[#8E8E96] text-base mb-10 text-center">QUICK ACTIONS</h1>
            <div class="flex w-full flex-col gap-3">
              <button class="bg-[#2563EB33/20] text-center rounded-lg py-4 font-semibold text-[#2563EB] text-sm hover:text-white hover:bg-[#2563EB] transition-all duration-300 ease border border-[#2563EB] cursor-pointer box-border">Request Repair</button>
              <button class="bg-white text-center rounded-lg py-4 font-semibold text-[#8E8E96] text-sm hover:text-white hover:bg-[#2563EB] transition-all duration-300 ease border border-[#2563EB] cursor-pointer">Find Technician</button>
            </div>
          </div>
          <div class="bg-[rgba(193,211,249,1)] rounded-lg pt-3 px-3 pb-10">
            <div class="flex flex-col gap-1 mb-7 text-center">
              <h1 class="text-[#8E8E96] text-base">Need Help?</h1>
              <p class="text-base text-slate-400">Our Support team</p>
              <p class="text-base text-[#8E8E96] text-slate-400">is here to help you</p>
            </div>
            <div class="flex w-full flex-col gap-3">
              <button class="bg-[#2563EB33/20] text-center rounded-lg py-4 font-semibold text-[#2563EB] text-sm hover:text-white hover:bg-[#2563EB] transition-all duration-300 ease border border-[#2563EB] cursor-pointer box-border">Contact Support</button>
            </div>
          </div>
        </div>
      </aside>
        <main class="flex-1 min-h-screen pt-32 px-10 pb-10 overflow-y-auto">
            <div class="border h-[59px] w-[141px] rounded-lg flex gap-2 items-center justify-center">
                <select name="Date" id="">
                    <option value="">This Month</option>
                </select>
            </div>
            <div class="pt-7 flex flex-col gap-3 pb-7">
                <h1 class="text-[24px]">Total Earnings</h1>
                <h1 class="text-[24px] font-extrabold">#325,600.00</h1>
                <h1 class="text-[24px]"><span class="text-green-500">+12%</span> from last month</h1>
            </div>
            <div class="border w-[595px] h-[118px] flex justify-between">
                <div class="border w-[282px] h-[118px] rounded-lg flex flex-col gap-3 items-center justify-center px-5 py-3">
                    <span>Completed Jobs</span>
                    <span class="font-bold">28</span>
                </div>
                <div class="border w-[282px] h-[118px] rounded-lg flex flex-col gap-3 items-center justify-center px-5 py-3">
                    <span>Average Ratings</span>
                    <span class="font-bold">4.8</span>
                </div>
            </div>
            <div>
                
            </div>

        </main>

    </div>
