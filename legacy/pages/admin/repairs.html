<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Operations & Disputes - RepairHub Admin</title>
    <link rel="stylesheet" href="../../src/style.css">
</head>

<!--
    No backend endpoint exists yet for repair operations / disputes.
    This page renders the agreed design with static sample data so the
    UI is ready to wire up once that endpoint ships. See admin-repairs.js.
-->

<body class="bg-[#f8fafc] text-[#111827]">

    <div id="adminSidebarRoot"></div>

    <div class="min-h-screen lg:ml-[234px]">

        <div id="adminTopbarRoot"></div>

        <main class="px-5 pb-8 sm:px-8">

            <!-- STAT CARDS -->
            <div class="mb-6 grid gap-4 sm:grid-cols-3">

                <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="rounded-xl bg-amber-100 p-3">
                            <svg class="h-6 w-6 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 8v4"></path>
                                <path d="M12 16h.01"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">Escalated Conflicts</p>
                            <h2 class="text-xl font-bold" id="statEscalated">12 Active Cases</h2>
                        </div>
                    </div>
                </div>

                <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="rounded-xl bg-emerald-100 p-3">
                            <svg class="h-6 w-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="m8 12 3 3 5-6"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">Resolved This Week</p>
                            <h2 class="text-xl font-bold">48 Resolved</h2>
                        </div>
                    </div>
                </div>

                <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="rounded-xl bg-blue-50 p-3">
                            <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 7v5l3 3"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">Avg Resolution Time</p>
                            <h2 class="text-xl font-bold">18.4 Hours</h2>
                        </div>
                    </div>
                </div>

            </div>

            <!-- TABS + TABLE -->
            <div class="rounded-xl border border-gray-200 bg-white shadow-sm">

                <div class="flex flex-col gap-4 border-b border-gray-100 p-5 sm:flex-row sm:items-center sm:justify-between">
                    <div class="flex gap-2">
                        <button data-view="active" class="view-btn rounded-lg px-3 py-2 text-xs font-semibold text-slate-500">
                            Active Repairs (318)
                        </button>
                        <button data-view="history" class="view-btn rounded-lg px-3 py-2 text-xs font-semibold text-slate-500">
                            Completed History
                        </button>
                        <button data-view="disputes" class="view-btn rounded-lg bg-[#0f172a] px-3 py-2 text-xs font-semibold text-white">
                            Open Disputes ●
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <input id="jobSearch" type="text" placeholder="Search job reference..." class="h-9 w-56 rounded-lg border border-gray-200 px-3 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full min-w-[900px] text-left text-sm">
                        <thead>
                            <tr class="border-b bg-slate-50 text-xs text-slate-500">
                                <th class="p-3">Job Reference</th>
                                <th class="p-3">Customer Name</th>
                                <th class="p-3">Technician Name</th>
                                <th class="p-3">Device Model</th>
                                <th class="p-3">Service Cost</th>
                                <th class="p-3">Dispute Status</th>
                                <th class="p-3">Escalation Reason</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="repairsTableBody"></tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between p-5 text-xs text-slate-500">
                    <span id="resultsSummary">Showing 1 to 4 of 12 active disputes</span>
                    <div class="flex gap-2">
                        <button class="rounded-lg border border-gray-200 px-3 py-1.5 font-semibold text-slate-500">Previous</button>
                        <button class="rounded-lg bg-blue-600 px-3 py-1.5 font-semibold text-white">1</button>
                        <button class="rounded-lg border border-gray-200 px-3 py-1.5 font-semibold text-slate-500">Next</button>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script type="module" src="../../src/js/admin-repairs.js"></script>

</body>

</html>
